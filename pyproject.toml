[project]
name = "bidops"
version = "0.1.0"
description = "Offline-first, evidence-preserving procurement notice infrastructure"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "httpx[socks]>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic-ai-slim[openai]>=2.59.0",
  "pydantic-evals>=2.59.0",
  "authlib>=1.7,<2",
  "itsdangerous>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "limits>=4,<6",
]

[project.scripts]
bidops = "bidops.cli:main"
bidops-demo = "bidops.agent_demo.cli:main"
bidops-enterprise = "bidops.enterprise.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/bidops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
