services:
  app:
    build: .
    image: bidops-enterprise:local
    init: true
    restart: unless-stopped
    env_file:
      - private/enterprise.env
      - private/deepseek.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - enterprise-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 90s
volumes:
  enterprise-data:
