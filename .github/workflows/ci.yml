name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          BIDOPS_NETWORK_ENABLED: 'false'
      - name: Verify frozen B01 scorer fixture (no model calls)
        run: |
          uv run --frozen --no-sync python scripts/screening_eval.py \
            --expected-freeze-sha256 22a2adf96f07b9a3e9c1493dae2cebbe2499b6e05db21f2b52855686c2afffea \
            --expected-input-sha256 eda43a451ae978251de4be003f1c062d1a4d3e93db9249c9c5458966628f44fb \
            --output "$RUNNER_TEMP/bidops-b01-calibration.json"
      - run: uv run bidops migrate
      - run: uv run python scripts/p0_pilot.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Install real company API browser fixture backend
        run: uv sync --frozen --python 3.12
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The hosted Ubuntu image already provides Chrome and its system dependencies.
      - run: google-chrome --version
      - run: npm run test:e2e
        env:
          BIDOPS_BROWSER_CHANNEL: chrome
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bidops:ci .
      - name: Start enterprise container with ephemeral protocol-only configuration
        run: |
          docker run -d --name bidops-smoke -p 127.0.0.1:8765:8765 \
            -e BIDOPS_ENTERPRISE_PUBLIC_URL=https://bidops.test \
            -e BIDOPS_ENTERPRISE_OIDC_ISSUER=https://identity.test/realms/unit \
            -e BIDOPS_ENTERPRISE_OIDC_CLIENT_SECRET=UNIT_NOT_A_CREDENTIAL \
            -e BIDOPS_ENTERPRISE_COOKIE_SECRET="$(openssl rand -hex 32)" \
            -e BIDOPS_DEMO_ENABLED=false bidops:ci
      - name: Verify packaging, unprivileged process and anonymous access denial
        run: |
          python scripts/container_smoke.py
          test "$(docker exec bidops-smoke id -u)" = 10001
      - if: always()
        run: docker rm -f bidops-smoke
