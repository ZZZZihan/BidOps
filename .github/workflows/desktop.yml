name: Desktop offline checks
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: desktop/go.sum
      - run: go mod verify
      - run: go test -count=1 ./...
      - run: go vet ./...
      # These are portable connection/download-controller checks. Native WebView,
      # system dialogs, packaging, signing and release are separately verified.
